<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Board Gradient -->
    <linearGradient id="clapperBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33373B"/>
      <stop offset="100%" stop-color="#1A1C1E"/>
    </linearGradient>

    <!-- Hinge Metal Gradient -->
    <linearGradient id="metalHinge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Main Clapperboard Body Base -->
    <rect x="64" y="200" width="384" height="248" rx="28" fill="url(#clapperBody)"/>

    <!-- Slate Chalk Lines / Details -->
    <rect x="96" y="240" width="140" height="8" rx="4" fill="#64748B" opacity="0.6"/>
    <rect x="96" y="268" width="200" height="8" rx="4" fill="#64748B" opacity="0.4"/>
    <rect x="96" y="296" width="90" height="8" rx="4" fill="#64748B" opacity="0.4"/>

    <!-- LOWER FIXED BAR -->
    <g>
      <rect x="64" y="160" width="384" height="52" rx="12" fill="#222528"/>
      <!-- White Slanted Stripes (Fixed Bar) -->
      <polygon points="120,160 165,160 125,212 80,212" fill="#F8FAFC"/>
      <polygon points="210,160 255,160 215,212 170,212" fill="#F8FAFC"/>
      <polygon points="300,160 345,160 305,212 260,212" fill="#F8FAFC"/>
      <polygon points="390,160 435,160 395,212 350,212" fill="#F8FAFC"/>
    </g>

    <!-- UPPER ANGLED CLAPPER BAR (OPEN) -->
    <g transform="rotate(-22 64 160)">
      <rect x="64" y="108" width="384" height="52" rx="12" fill="#222528"/>
      <!-- White Slanted Stripes (Angled Top Bar) -->
      <polygon points="120,108 165,108 125,160 80,160" fill="#F8FAFC"/>
      <polygon points="210,108 255,108 215,160 170,160" fill="#F8FAFC"/>
      <polygon points="300,108 345,108 305,160 260,160" fill="#F8FAFC"/>
      <polygon points="390,108 435,108 395,160 350,160" fill="#F8FAFC"/>
    </g>

    <!-- HINGE SCREW / PIVOT JOINT -->
    <circle cx="84" cy="186" r="14" fill="url(#metalHinge)"/>
    <circle cx="84" cy="186" r="6" fill="#0F172A"/>
  </g>
</svg>
